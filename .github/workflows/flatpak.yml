# A tag v1.2.3 builds the Flatpak for x86-64 and arm64 (app/linux/build-flatpak.sh),
# attaches both OSTree repositories to the `flatpak` release (flatpak-ARCH.tar)
# and has cpressland/flatpak publish them, signed, at flatpak.cpressland.io.
# Nothing of the game is in them. Run by hand on main it does the same; a
# pull request touching the Flatpak runs the builds alone.
#
# FLATPAK_HUB_TOKEN (optional): a fine-grained token with Actions: Read and
# write on cpressland/flatpak, to publish at once; without it, that
# repository's daily run picks the builds up.
name: flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:                # the builds only, not the publish
    paths: ["app/linux/**", "tools/install/**", ".github/workflows/flatpak.yml"]

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the version, from the tags

      - name: flatpak-builder and the freedesktop SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          # bubblewrap's sandbox needs user namespaces, which Ubuntu restricts
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: |
          version=
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          # Up to three tries: a source download now and then stalls (what was
          # fetched is kept in the state folder for the next).
          for try in 1 2 3; do
            FLATPAK_BUILDER_ARGS=--user app/linux/build-flatpak.sh ${version:+--version "$version"} "$RUNNER_TEMP/fp" && break
            [ "$try" = 3 ] && exit 1
            sleep 20
          done
          tar -C "$RUNNER_TEMP/fp" -cf "$RUNNER_TEMP/repo-${{ matrix.arch }}.tar" repo

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}
          path: ${{ runner.temp }}/repo-${{ matrix.arch }}.tar
          retention-days: 7

  release:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      HUB_TOKEN: ${{ secrets.FLATPAK_HUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          merge-multiple: true
          path: ${{ runner.temp }}/in

      - name: The flatpak release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/in"
          for t in repo-*.tar; do mv "$t" "flatpak-${t#repo-}"; done
          if gh release view flatpak > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/flatpak" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create flatpak --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Flatpak builds" \
              --notes "The latest Flatpak builds, which https://flatpak.cpressland.io serves (cpressland/flatpak signs and publishes them). Install from there, not from here."
          fi
          gh release upload flatpak flatpak-*.tar --clobber

      - name: Publish
        if: env.HUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_HUB_TOKEN }}
        run: gh workflow run publish --repo cpressland/flatpak
